name: CI / Build & Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Make Gradle wrapper executable
      #   run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:  ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradlewrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # - name: Get project version
        # id: get_version
        # run: |

        # VERSION="::set-output name=VERSION_NAME::$(${{github.workspace}}/gradlew -q printVersionName)"
        # VERSION=$(grep -E '^version=' gradle.properties | cut -d'=' -f2) echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get project version
        uses: thecodemonkey/action-get-gradle-version@master
        id: get_version

      - name: Build
        run: gradle --no-daemon clean build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 || '' }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body: Automated release for version ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url:  ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/libs/calculator-${{ steps.get_version.outputs.version }}.jar
          asset_name: calculator-${{ steps.get_version.outputs.version }}.jar
          asset_content_type: application/java-archive